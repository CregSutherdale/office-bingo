<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Bingo</title>
<meta name="description" content="The office bingo card: tap a square to X it, everyone sees it.">
<meta name="theme-color" content="#F4F5F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bingo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Gochi+Hand&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --board:#F4F5F1; --board-shade:#E6E8E2; --ink:#1B2230; --muted:#5E6673;
  --marker-blue:#1E3E9E; --marker-black:#141414; --marker-orange:#EE7A1E; --line:#39404A;
  --magnet:#F3B53A; --magnet-rim:#C98A16; --paper:#FFFFFF; --ok:#1F7A4E; --warn:#A35A00; --bad:#B3261E;
  --sheet:#FFFFFF; --chip:#ECEEE8;
  --title:"Permanent Marker", "Comic Sans MS", cursive;
  --hand:"Gochi Hand", "Segoe Print", "Comic Sans MS", cursive;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--board);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;
  padding-inline:max(14px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-right));
  padding-block:max(12px, env(safe-area-inset-top)) max(96px, calc(env(safe-area-inset-bottom) + 88px));
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--marker-orange);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header{display:flex;flex-direction:column;gap:4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--title);font-weight:400;color:var(--marker-orange);font-size:clamp(34px,10vw,52px);line-height:1;margin:0;
  letter-spacing:.5px;text-wrap:balance;transform:rotate(-1.5deg);transform-origin:left center}
.me{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)} .dot.demo{background:var(--warn)} .dot.off{background:var(--bad)}

.banner{border-radius:10px;padding:10px 12px;font-size:14px;background:#FFF3DD;border:1px solid #F0CF94;color:#6B4200}
.banner.past{background:#E9EEF9;border-color:#BCC9EA;color:#1E3E9E;display:flex;justify-content:space-between;gap:10px;align-items:center}
.banner button{border:0;background:none;text-decoration:underline;font-weight:700;padding:0}

/* the board */
.board{position:relative;background:var(--paper);border-radius:6px;padding:10px;
  box-shadow:0 1px 0 var(--board-shade),0 10px 24px -14px rgba(20,24,30,.45)}
.magnet{position:absolute;width:30px;height:30px;border-radius:50%;top:-11px;
  background:radial-gradient(circle at 35% 32%,#FFE39A 0 22%,var(--magnet) 55%,var(--magnet-rim) 100%);
  box-shadow:0 3px 5px rgba(0,0,0,.28)}
.magnet.l{left:-9px} .magnet.r{right:-9px}
.grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);border:2px solid var(--line)}
.cell{position:relative;aspect-ratio:1/1;border:0;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);
  background:transparent;padding:4px;display:flex;align-items:center;justify-content:center;container-type:inline-size;min-width:0}
.cell:nth-child(5n){border-right:0}
.cell:nth-child(n+21){border-bottom:0}
.cell .label{font-family:var(--hand);color:var(--marker-blue);font-size:clamp(12px,22cqi,28px);line-height:1.02;text-align:center;
  overflow-wrap:anywhere;hyphens:auto;transform:rotate(var(--tilt,0deg))}
.cell.free .label{color:var(--marker-orange);font-family:var(--title);font-size:clamp(10px,16cqi,22px)}
.cell svg.x{position:absolute;inset:6%;width:88%;height:88%;pointer-events:none;overflow:visible}
.cell svg.x path{fill:none;stroke:var(--marker-black);stroke-width:9;stroke-linecap:round;opacity:.9}
.cell.fresh svg.x path{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .28s ease-out forwards}
.cell.fresh svg.x path+path{animation-delay:.16s}
@keyframes draw{to{stroke-dashoffset:0}}
.cell .who{position:absolute;right:3px;bottom:2px;font-size:clamp(8px,11cqi,12px);font-weight:700;color:#fff;background:var(--marker-black);
  border-radius:4px;padding:0 3px;line-height:1.35;letter-spacing:.3px}
.cell:active{background:#F2F4EF}
.grid.readonly .cell{cursor:default}
.lines{position:absolute;inset:0;pointer-events:none}
.lines line{stroke:var(--marker-orange);stroke-width:2.6;stroke-linecap:round;opacity:.72}

.score{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-weight:700;border-radius:999px;padding:5px 11px;background:var(--chip);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.pill.bingo{background:var(--marker-orange);color:#fff}
.pill .n{font-variant-numeric:tabular-nums}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.leader{display:flex;gap:8px;flex-wrap:wrap}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,245,241,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--board-shade);padding:10px max(14px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right))}
.bar .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar button{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 6px;font-weight:700;font-size:15px}
.bar button.primary{background:var(--marker-blue);border-color:var(--marker-blue);color:#fff}

/* sheets */
dialog{border:0;border-radius:16px;padding:0;max-width:min(560px,calc(100vw - 24px));width:100%;background:var(--sheet);color:var(--ink);
  box-shadow:0 20px 50px -10px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,24,30,.45)}
.sheet{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:min(80vh,720px);overflow:auto}
.sheet h3{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--marker-blue);border-color:var(--marker-blue);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.names{display:flex;gap:8px;flex-wrap:wrap}
.names button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:700}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:1.5px solid #C9CDC5;border-radius:10px;padding:9px 11px;background:#fff}
label.lab{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px;align-items:center;border-bottom:1px solid #ECEEE8;padding-bottom:6px}
.item .nm{font-family:var(--hand);color:var(--marker-blue);font-size:20px;overflow-wrap:anywhere}
.item .ct{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.step{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.rm{border:0;background:none;color:var(--bad);font-weight:700;padding:4px 6px}
.total{font-weight:700}
.total.bad{color:var(--warn)}
.team{display:flex;gap:8px;flex-wrap:wrap}
.team span{background:var(--chip);border-radius:999px;padding:5px 6px 5px 12px;display:inline-flex;gap:4px;align-items:center;font-weight:700}
.weeks{display:flex;flex-direction:column;gap:6px}
.weeks button{border:1.5px solid #C9CDC5;background:#fff;border-radius:10px;padding:10px 12px;text-align:left;font-weight:700;display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:50;
  background:var(--marker-black);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;max-width:calc(100vw - 28px);text-align:center;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.bingo{background:var(--marker-orange);font-family:var(--title);font-weight:400;font-size:26px;padding:12px 22px}
canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.cell.fresh svg.x path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 id="title">Sales Bingo</h1>
      <button class="me" id="meBtn" type="button" aria-label="Change who is playing on this phone">Who?</button>
    </div>
    <div class="sub">
      <span id="weekLabel">This week</span>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">Loading</span></span>
    </div>
  </header>

  <div id="demoBanner" class="banner" hidden>Demo mode: X's stay on this phone until the shared database is connected.</div>
  <div id="pastBanner" class="banner past" hidden><span id="pastText">Past week</span><button type="button" id="backBtn">Back to this week</button></div>

  <section class="board" aria-label="Bingo card">
    <span class="magnet l" aria-hidden="true"></span><span class="magnet r" aria-hidden="true"></span>
    <div class="grid" id="grid" role="grid"></div>
  </section>

  <div class="score" id="score"></div>
  <h2>This week's X's</h2>
  <div class="leader" id="leader"></div>
  <p class="small" id="hint">Tap a square when you get it. Tap an X to see who got it or take it off.</p>
</div>

<nav class="bar"><div class="row">
  <button type="button" id="historyBtn">Past weeks</button>
  <button type="button" id="shuffleBtn">Shuffle</button>
  <button type="button" id="settingsBtn" class="primary">Settings</button>
</div></nav>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
